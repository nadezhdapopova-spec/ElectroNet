services:
  web:
    container_name: electronet_web
#    image: ${DOCKER_HUB_USERNAME}/electronet:${DOCKER_HUB_TAG}
    build: .
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD}
      - ALLOWED_HOSTS=${BASE_SERVER_URL}
    volumes:
      - en_static_volume:/app/staticfiles
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - en_static_volume:/app/staticfiles:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
  db:
    container_name: electronet_db
    image: postgres:16.0
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - en_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  en_postgres_data:
  en_static_volume:
